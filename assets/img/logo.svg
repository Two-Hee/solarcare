  <!--
    이메일 서명 / 문서 / 명함 등 웹사이트 밖에서 쓰는 가로형 로고입니다.
    (웹사이트 헤더는 실제 웹폰트를 쓰기 위해 마크 SVG + HTML 텍스트로 조립합니다)
    ※ 워드마크가 텍스트로 되어 있어 Pretendard 미설치 환경에서는 대체서체로 표시됩니다.
       인쇄물에 쓸 때는 벡터 편집기에서 텍스트를 '윤곽선으로 변환' 후 사용하세요.
  -->
  <g transform="translate(4, 4)">
    <!-- 심볼 -->
    <g transform="scale(1)">
      <g stroke="#FF9E1B" stroke-width="2.4" stroke-linecap="round">
        <line x1="24"    y1="5.5"  x2="24"    y2="2.5"/>
        <line x1="15.96" y1="9.25" x2="13.66" y2="7.32"/>
        <line x1="32.04" y1="9.25" x2="34.34" y2="7.32"/>
