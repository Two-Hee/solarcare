      </g>
      <circle cx="24" cy="16" r="8" fill="#FF9E1B"/>
      <path d="M10 42 L15 29 H38 L43 42 Z" fill="#0B2A4A"/>
      <g stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="1.4">
